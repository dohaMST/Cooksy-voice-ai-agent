# Cooksy local services.
#
# Every service is bound to loopback only, so none of it is reachable from the LAN.
# The named volume means `docker compose down` does NOT wipe the week plan you
# built; only `down -v` does, which is the deliberate destructive form.
#
# No TTL index is created here or anywhere else. Pending approvals expire via
# the API's sweeper / on-read check, so an expired approval is audited instead
# of being silently deleted before its outcome is recorded.

services:
  mongo:
    image: mongo:7
    container_name: cooksy-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cooksy
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - cooksy-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Kokoro speech synthesis. Bound to loopback: the browser reaches it directly
  # and nothing on the LAN can. Only used when the Kokoro voice engine is chosen
  # in Settings; device voices remain the default.
  #
  # This is the CPU image, which runs slower than realtime on a laptop. The
  # console streams the audio and starts playing before the whole reply has
  # been synthesized, so the wait is bounded by the first chunk, not the last.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    container_name: cooksy-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request as u; u.urlopen(''http://localhost:8880/health'', timeout=3)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  cooksy-mongo:
